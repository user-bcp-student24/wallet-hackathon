services:
  wallet-db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wallet}
      POSTGRES_USER: ${POSTGRES_USER:-wallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_local_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wallet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  wallet-services:
    profiles:
      - app
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: wallet-db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-wallet}
      DB_USER: ${POSTGRES_USER:-wallet}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-wallet_local_dev}
      PORT: 5000
      HOST: 0.0.0.0
    depends_on:
      - wallet-db
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

  wallet-front:
    profiles:
      - app
    build:
      context: ./wallet-front
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - wallet-services
    ports:
      - "127.0.0.1:5173:80"

volumes:
  wallet-db-data:
